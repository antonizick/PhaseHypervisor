[project]
name = "phx"
version = "0.0.0"
description = "Hands-off deployer for phased-project implementation plans"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nick Antonizick" }]
dependencies = []

[project.scripts]
phx = "phx.cli:main"

[dependency-groups]
dev = [
    "coverage>=7.6",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/phx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src"]

[tool.coverage.run]
branch = true
source = ["phx"]

[tool.coverage.report]
show_missing = true
skip_covered = true
