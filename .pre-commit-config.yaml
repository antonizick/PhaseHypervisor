repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff-check
      - id: ruff-format
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        # .phx/preflight.json holds SHA-256 plan fingerprints written by `phx preflight --record`, not secrets.
        args: ["--baseline", ".secrets.baseline", "--exclude-files", "^\\.phx/preflight\\.json$"]
